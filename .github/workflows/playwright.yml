name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment: '
        required: true
        default: 'develop'
        type: choice
        options:
          - 'develop'
          - 'staging'
          - 'qa'
          - 'production'
      tags:
        description: 'Test scenario tags: @tag_name'
        default: '@smoke'
        required: true
        type: string
      browser:
        description: 'Browser: '
        required: true
        default: 'chromium'
        type: choice
        options:
          - 'chromium'
          - 'firefox'
          - 'webkit'

  pull_request:
    branches: [ main, develop ]

jobs:       

  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      GREP: ${{ inputs.tags || '@smoke' }}
      PROJECT: ${{ inputs.browser || 'chromium' }}
    steps:

    - uses: actions/checkout@v6

    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Run Playwright tests
      env:
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ENVIRONMENT: ${{ inputs.environment == 'develop' && '' || inputs.environment }}
      run: pnpm bddgen && pnpm playwright test --grep ${{ inputs.tags }}  --project=${{ inputs.browser }}

    - uses: actions/upload-artifact@v7

      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
