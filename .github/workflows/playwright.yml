name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment: '
        required: true
        default: 'develop'
        type: choice
        options:
          - 'develop'
          - 'staging'
          - 'production'
      tags:
        description: 'Test scenario tags: @tag_name'
        default: '@smoke'
        required: true
        type: string
      
      browser:
        description: 'Browser: '
        required: true
        default: 'chromium'
        type: choice
        options:
          - 'firefox'
          - 'webkit'

  pull_request:
    branches: [ main, develop ]
jobs:       
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: USER_NAME="${{ secrets.USER_NAME}}" USER_PASSWORD="${{ secrets.USER_PASSWORD}}"  pnpm bddgen && pnpm playwright test ${{ inputs.tags }} 
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
